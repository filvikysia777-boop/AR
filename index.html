<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Лабораторная работа №4 - AR</title>

    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">

            <a-text value="МГТУ СТАНКИН" position="0 1.2 0" align="center" color="white" scale="2 2 2"></a-text>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
